name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' RemoteRewriteApp.csproj)"
          test -n "$project_version"
          test "$GITHUB_REF_NAME" = "v$project_version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Run tests
        run: sh scripts/test.sh

      - name: Package and smoke test app
        run: sh scripts/smoke-test.sh

      - name: Build changelog
        run: sh scripts/update-changelog.sh

      - name: Extract release notes
        run: |
          mkdir -p release-artifact
          cp dist/RemoteRewriteApp.zip release-artifact/RemoteRewriteApp.zip
          sha256sum release-artifact/RemoteRewriteApp.zip \
            | sed 's#release-artifact/##' > release-artifact/RemoteRewriteApp.zip.sha256
          sh scripts/extract-release-notes.sh "${GITHUB_REF_NAME}" CHANGELOG.md > release-artifact/RELEASE_NOTES.md

      - name: Upload tested release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RemoteRewriteApp-release-${{ github.sha }}
          if-no-files-found: error
          path: release-artifact/
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download tested release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RemoteRewriteApp-release-${{ github.sha }}
          path: release-artifact

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: release-artifact/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-artifact/RemoteRewriteApp.zip
            release-artifact/RemoteRewriteApp.zip.sha256
